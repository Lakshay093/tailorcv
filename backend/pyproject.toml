[project]
name = "tailorcv-api"
version = "1.0.0"
description = "Stateless, evidence-conscious resume tailoring with Gemini"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.143.1",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "google-genai==2.31.0",
  "pdfplumber==0.11.10",
  "python-docx==1.2.0",
  "reportlab==5.0.1",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
